cover_letter_workflow:
  # career-ops apply 모드를 오버라이드함. 자소서 작성은 /cover-letter 스킬 사용.
  direct_draft: false
  skill: ".claude/skills/cover-letter/SKILL.md"
  review_skill: ".claude/skills/cover-letter/review.md"
  steps:
    - "공고 분석 + 경험 매칭"
    - "지원동기 방향 2~3개 제시 (A/B/C)"
    - "사용자가 방향 선택"
    - "초안 작성 (/cover-letter write 스킬 실행)"
    - "면접관 에이전트 리뷰 필수 (/cover-letter review 스킬)"
    - "사용자 최종 수정"
  principles:
    - "자소서는 면접 유도 도구. 모든 걸 증명하지 않음"
    - "필살기 프레임워크 (필살기/빌살기/밉살기)"
    - "두괄식 = 면접 주도권 확보"
    - "AI 생성 흔적 제거 (문장 길이 다양화, 열정/혁신/시너지 등 제거)"
    - "AI 생성 기업 수치는 반드시 팩트체크"

interview_review_workflow:
  # 자소서 작성/수정 후 필수 (면접관 관점 검증)
  required: true
  checklist:
    - "자소서 전반 피드백 (첫인상, 항목별 강약점, 떡밥/과잉증명)"
    - "필살기 분석 (무엇인지, 면접관 질문을 유도하는지)"
    - "면접 질문 리스트 (면접관 의도 + 답변 방향 + 필수 키워드)"
    - "구체적 수정 제안"
