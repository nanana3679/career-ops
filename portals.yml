# Portal Scanner Configuration
# 주의: career-ops의 scan.mjs는 Greenhouse/Ashby/Lever API 전용.
# 한국 사이트(원티드/사람인/잡코리아/점핏)는 현재 미지원 → 수동 URL/이미지 입력 사용.
# 한국 사이트 스캐너는 별도 구현 필요 (TODO: wanted.co.kr API 리버싱 등).

